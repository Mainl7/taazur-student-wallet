services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taazur
      MYSQL_USER: taazur
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://taazur:change-me@mysql:3306/taazur
      JWT_SECRET: development-secret-change-before-deploying
    ports: ["4000:4000"]
    depends_on: [mysql, redis]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  mysql-data:
